# Cloud Build configuration for NoMAD
# Builds x86_64 container and deploys to Cloud Run

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nomad:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nomad:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/nomad:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/nomad:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nomad'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nomad:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--timeout'
      - '60'
      - '--concurrency'
      - '100'
      # IMPORTANT: BASE_URL must be the public custom domain — it builds the OIDC redirect_uri
      # that Okta validates. Using the raw run.app URL breaks login (400 invalid_request).
      - '--set-env-vars'
      - 'BASE_URL=https://nomad.it.prewave.ai,OKTA_DOMAIN=prewave.okta.com'
      - '--set-secrets'
      - 'DATABASE_URL=nomad-database-url:latest,ATLASSIAN_OAUTH_CLIENT_ID=nomad-atlassian-oauth-client-id:latest,ATLASSIAN_OAUTH_CLIENT_SECRET=nomad-atlassian-oauth-client-secret:latest,OKTA_CLIENT_ID=nomad-okta-client-id:latest,OKTA_CLIENT_SECRET=nomad-okta-client-secret:latest'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:europe-west6:nomad-db'

images:
  - 'gcr.io/$PROJECT_ID/nomad:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/nomad:latest'

options:
  logging: CLOUD_LOGGING_ONLY
