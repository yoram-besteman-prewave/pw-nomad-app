# Cloud Build configuration for NoMAD
# Builds x86_64 container and deploys to Cloud Run

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nomad:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nomad:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/nomad:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/nomad:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nomad'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nomad:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--set-env-vars'
      - 'BASE_URL=https://nomad-750886765018.europe-west1.run.app'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:europe-west6:nomad-db'

images:
  - 'gcr.io/$PROJECT_ID/nomad:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/nomad:latest'

options:
  logging: CLOUD_LOGGING_ONLY
